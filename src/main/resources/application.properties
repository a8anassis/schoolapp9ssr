# Ο ForwardedHeaderFilter αναλαμβάνει τα X-Forwarded-*, ώστε το
# getRemoteAddr() να επιστρέφει την πραγματική IP πίσω από proxy.
# Ενεργοποιείται ΜΟΝΟ όταν υπάρχει έμπιστος reverse proxy μπροστά —
# αλλιώς ο header είναι απλό user input και πλαστογραφείται ελεύθερα.
server.forward-headers-strategy=framework